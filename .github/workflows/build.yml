name: Build and portable tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable tests only
        run: cmake -S native -B native/build -DMCSPATIAL_BUILD_MAC_BACKEND=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native/build --parallel
      - run: ctest --test-dir native/build --output-on-failure

  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile NeoForge mod and run Java tests
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: java-only-mod-NOT-macos-ready
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build universal JNI backend and native probe
        run: bash scripts/build-native.sh
      - name: Package mod with native backend
        run: gradle --no-daemon clean build
      - name: Verify packaged dylib
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -name '*.jar' -not -name '*sources*' | head -n 1)
          jar tf "$JAR" | grep -q 'natives/macos/universal/libmcspatial.dylib'
          lipo -info native/build/libmcspatial.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-macos-mod
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Archive probe without losing bundle structure
        run: ditto -c -k --sequesterRsrc --keepParent native/build/MCSpatialProbe.app native/build/MCSpatialProbe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-native-probe
          path: native/build/MCSpatialProbe.zip
          if-no-files-found: error
