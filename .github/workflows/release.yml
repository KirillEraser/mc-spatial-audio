name: Build and publish macOS release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 1.0.0-rc.1 or 1.0.0; existing releases are never overwritten'
        required: true
        default: '1.0.0-rc.1'
        type: string
      hardware_confirmed:
        description: 'For stable only: confirm this version passed config/reload, listening balance and Apple recentering checks'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mcspatial-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version || '1.0.0-rc.1' }}
  HARDWARE_CONFIRMED: ${{ inputs.hardware_confirmed || false }}
  TRACKING_ISSUE: '4'

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B native/build -DMCSPATIAL_BUILD_MAC_BACKEND=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native/build --parallel
      - run: ctest --test-dir native/build --output-on-failure

  macos-build:
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo 'Expected a version such as 1.0.0-rc.1 or 1.0.0' >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != *-* && "$HARDWARE_CONFIRMED" != 'true' ]]; then
            echo 'Stable publication needs confirmation of this version on real hardware; use an -rc candidate first.' >&2
            exit 1
          fi
          mkdir -p logs dist
      - name: Report build start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "macOS build started for commit $GITHUB_SHA (version $RELEASE_VERSION). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No new release download is confirmed yet."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and test universal native backend
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-native.sh 2>&1 | tee logs/native-build.log
      - name: Build mod and run all Java tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -Pmod_version="$RELEASE_VERSION" clean build 2>&1 | tee logs/mod-build.log
      - name: Verify packaged native library and JNI ABI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release.sh "$RELEASE_VERSION" 2>&1 | tee logs/verification.log
      - name: Package download files
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-release.sh "$RELEASE_VERSION" 2>&1 | tee logs/packaging.log
      - uses: actions/upload-artifact@v4
        with:
          name: release-download-files
          path: dist/*
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-diagnostics
          path: |
            logs/
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
      - name: Report build failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            printf 'macOS build FAILED for commit %s. No release was published by this build.\n\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            for log in logs/native-build.log logs/mod-build.log logs/verification.log logs/packaging.log; do
              if [[ -f "$log" ]]; then
                printf '\n### %s (last 100 lines)\n```text\n' "$log"
                tail -n 100 "$log"
                printf '\n```\n'
              fi
            done
            for report in build/test-results/test/TEST-*.xml; do
              if [[ -f "$report" ]] && grep -q '<failure' "$report"; then
                printf '\n### Failing test report: %s\n```xml\n' "$report"
                tail -n 70 "$report"
                printf '\n```\n'
              fi
            done
          } > "$RUNNER_TEMP/release-build-failure.md"
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/release-build-failure.md"

  publish:
    needs: [portable-tests, macos-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-download-files
          path: dist
      - name: Verify downloaded files
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Publish without overwriting an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new version. Nothing was overwritten." >&2
            exit 1
          fi
          cp dist/RELEASE_NOTES.md "$RUNNER_TEMP/release-notes.md"
          FLAGS=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            FLAGS+=(--prerelease)
            printf '\nPublication status: release candidate; runtime acceptance still required.\n' >> "$RUNNER_TEMP/release-notes.md"
          else
            test "$HARDWARE_CONFIRMED" = 'true'
            printf '\nPublication status: stable; runtime acceptance confirmed by the publisher for this version.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MC Spatial Audio $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}" \
            "dist/mc-spatial-audio-$RELEASE_VERSION.jar" \
            dist/MCSpatialProbe-macos-universal.zip \
            dist/INSTALL.md \
            dist/RELEASE_NOTES.md \
            dist/SHA256SUMS.txt
      - name: Report published download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Release v$RELEASE_VERSION published after automated checks passed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$RELEASE_VERSION. Download the JAR asset. Hardware/runtime confirmation flag: $HARDWARE_CONFIRMED. Candidate publication does not replace the new UI, balance, recentering and coexistence tests."
      - name: Report publication failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Publication failed or was refused. Inspect $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A new release is not confirmed by this workflow run."
