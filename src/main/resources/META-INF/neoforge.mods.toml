modLoader="javafml"
loaderVersion="[1,)"
license="MIT"
issueTrackerURL="https://github.com/KirillEraser/mc-spatial-audio/issues"

[[mods]]
modId="mc_spatial_audio"
version="${mod_version}"
displayName="MC Spatial Audio"
authors="KirillEraser and contributors"
displayURL="https://github.com/KirillEraser/mc-spatial-audio"
description='''
Apple-native spatial audio for Minecraft on macOS.
Routes Minecraft's 7.1 OpenAL mix through Apple's headphone renderer,
with optional head tracking on supported headphones such as AirPods Pro.
Keeps Minecraft's positioning and distance attenuation; Sound Physics
Remastered is optional. Configure through the Mods menu.
'''

[[mixins]]
config="mc_spatial_audio.mixins.json"

[[dependencies.mc_spatial_audio]]
modId="neoforge"
type="required"
versionRange="[21.1.256,21.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.mc_spatial_audio]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="CLIENT"

[[dependencies.mc_spatial_audio]]
modId="sound_physics_remastered"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
