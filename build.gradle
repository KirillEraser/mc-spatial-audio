plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'dev.kirilleraser.mcspatial'
base { archivesName = 'mc-spatial-audio' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    // Bytecode hook tests read the actual mapped Minecraft Library.class.
    addModdingDependenciesTo(sourceSets.test)
    runs {
        client { client() }
    }
    mods {
        mc_spatial_audio { sourceSet sourceSets.main }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Declare ASM explicitly instead of relying on the main mod's toolchain classpath.
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources) {
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) {
    from('LICENSE')
    manifest.attributes('Implementation-Version': project.version)
}
